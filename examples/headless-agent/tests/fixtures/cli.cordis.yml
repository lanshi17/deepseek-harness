- id: cli-mock-llm
  name: './cli-mock-llm.ts'

- id: base
  name: '@lanshi17/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@lanshi17/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@lanshi17/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: cli-mock
              model: cli-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          dshHome: './.dsh-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless headless-agent smoke.'
      - id: persistence
        name: '@lanshi17/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
